<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" width="600" height="510" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Comic Neue',cursive" fill="#1f2a37"><defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
</filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eef5" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a37"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f5fd0"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e5b"/></marker>
<symbol id="person" viewBox="-30 -30 60 90" width="60" height="90" overflow="visible">
  <g fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"><circle cx="0" cy="-12" r="16" fill="#fff"/><path d="M0 4V38M-20 18L0 10L20 18M0 38L-14 58M0 38L14 58"/></g>
</symbol>
<symbol id="phone" viewBox="0 0 64 100" width="64" height="100" overflow="visible">
  <g stroke="#1f2a37" stroke-width="3"><rect x="2" y="2" width="60" height="96" rx="10" fill="#fff"/><rect x="10" y="14" width="44" height="60" rx="3" fill="#e6eefc"/><circle cx="32" cy="86" r="5" fill="#fff"/></g>
</symbol>
</defs><rect width="600" height="510" fill="#ffffff"/><rect width="600" height="510" fill="url(#grid)"/><g transform="translate(15,15)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">2</text><text x="64" y="46" font-size="22" font-weight="700">A translator in the middle</text>
<g filter="url(#rough)">
  <rect x="24" y="150" width="130" height="80" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <rect x="210" y="135" width="150" height="110" rx="12" fill="#e6eefc" stroke="#2f5fd0" stroke-width="3.5"/>
  <rect x="416" y="150" width="130" height="80" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <path d="M156 168 H206" stroke="#2f5fd0" stroke-width="3" marker-end="url(#arb)"/>
  <path d="M362 168 H412" stroke="#2f5fd0" stroke-width="3" marker-end="url(#arb)"/>
  <path d="M412 214 H364" stroke="#2f9e5b" stroke-width="3" marker-end="url(#arg)"/>
  <path d="M206 214 H158" stroke="#2f9e5b" stroke-width="3" marker-end="url(#arg)"/>
</g>
<text x="89" y="186" text-anchor="middle" font-size="14" font-weight="700">Customer</text><text x="89" y="204" text-anchor="middle" font-size="14" font-weight="700">line</text>
<text x="285" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5fd0">Presence</text><text x="285" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5fd0">Sync</text>
<text x="481" y="186" text-anchor="middle" font-size="14" font-weight="700">Work</text><text x="481" y="204" text-anchor="middle" font-size="14" font-weight="700">phone</text>
<text x="285" y="116" text-anchor="middle" font-size="15" fill="#2f5fd0">"She is busy, hold her calls"</text>
<text x="285" y="278" text-anchor="middle" font-size="15" fill="#2f9e5b">"She is free again"</text>
<text x="30" y="390" font-size="15">•</text><text x="46" y="390" font-size="15">When one side sees Priya get busy or free,</text><text x="46" y="412" font-size="15">Presence Sync tells the other side right away.</text><text x="30" y="434" font-size="15">•</text><text x="46" y="434" font-size="15">Both directions, in real time, for many</text><text x="46" y="456" font-size="15">companies at once.</text></g></svg>