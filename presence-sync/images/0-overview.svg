<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 1670" width="1230" height="1670" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Comic Neue',cursive" fill="#1f2a37"><defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
</filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eef5" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a37"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f5fd0"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e5b"/></marker>
<symbol id="person" viewBox="-30 -30 60 90" width="60" height="90" overflow="visible">
  <g fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"><circle cx="0" cy="-12" r="16" fill="#fff"/><path d="M0 4V38M-20 18L0 10L20 18M0 38L-14 58M0 38L14 58"/></g>
</symbol>
<symbol id="phone" viewBox="0 0 64 100" width="64" height="100" overflow="visible">
  <g stroke="#1f2a37" stroke-width="3"><rect x="2" y="2" width="60" height="96" rx="10" fill="#fff"/><rect x="10" y="14" width="44" height="60" rx="3" fill="#e6eefc"/><circle cx="32" cy="86" r="5" fill="#fff"/></g>
</symbol>
</defs><rect width="1230" height="1670" fill="#ffffff"/><rect width="1230" height="1670" fill="url(#grid)"/><text x="615.0" y="56" text-anchor="middle" font-size="34" font-weight="700">Presence Sync: keeping two phones in agreement</text><text x="615.0" y="84" text-anchor="middle" font-size="16" fill="#566476">The story of a real-time sync system, told with one agent named Priya</text><g transform="translate(30,110)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">1</text><text x="64" y="46" font-size="22" font-weight="700">Two phones that never talk</text>
<g filter="url(#rough)">
  <use href="#person" x="16" y="140"/>
  <path d="M76 190 H112" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <use href="#phone" x="118" y="126"/>
  <use href="#phone" x="480" y="126"/>
  <use href="#person" x="262" y="140"/>
  <path d="M186 176 Q222 150 258 176" fill="none" stroke="#d64545" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M332 114 h124 a12 12 0 0 1 12 12 v38 a12 12 0 0 1 -12 12 h-84 l-22 22 l3 -22 h-21 a12 12 0 0 1 -12 -12 v-38 a12 12 0 0 1 12 -12z" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/>
  <path d="M220 290 l46 28 M266 290 l-46 28" stroke="#d64545" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="94" y="178" text-anchor="middle" font-size="11" fill="#566476">calls in</text>
<text x="46" y="252" text-anchor="middle" font-size="13" font-weight="700">Customer</text>
<text x="150" y="252" text-anchor="middle" font-size="14" font-weight="700">Customer line</text>
<text x="150" y="270" text-anchor="middle" font-size="13" fill="#566476">contact center</text>
<text x="292" y="252" text-anchor="middle" font-size="14" font-weight="700">Priya</text>
<text x="292" y="270" text-anchor="middle" font-size="13" fill="#566476">the agent</text>
<text x="512" y="252" text-anchor="middle" font-size="14" font-weight="700">Work phone</text>
<text x="512" y="270" text-anchor="middle" font-size="13" fill="#566476">Teams, Zoom...</text>
<text x="222" y="128" text-anchor="middle" font-size="14" fill="#d64545">"New customer!"</text>
<text x="400" y="140" text-anchor="middle" font-size="13">On a Teams call</text>
<text x="400" y="158" text-anchor="middle" font-size="13">with my manager</text>
<text x="282" y="312" text-anchor="start" font-size="20" font-weight="700" fill="#d64545">Double-booked!</text>
<text x="30" y="390" font-size="15">•</text><text x="46" y="390" font-size="15">Priya has a customer line and a work phone.</text><text x="30" y="412" font-size="15">•</text><text x="46" y="412" font-size="15">Neither knows what the other is doing, so a</text><text x="46" y="434" font-size="15">customer reaches her while she's already busy</text><text x="46" y="456" font-size="15">on another call.</text></g><g transform="translate(630,110)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">2</text><text x="64" y="46" font-size="22" font-weight="700">A translator in the middle</text>
<g filter="url(#rough)">
  <rect x="24" y="150" width="130" height="80" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <rect x="210" y="135" width="150" height="110" rx="12" fill="#e6eefc" stroke="#2f5fd0" stroke-width="3.5"/>
  <rect x="416" y="150" width="130" height="80" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <path d="M156 168 H206" stroke="#2f5fd0" stroke-width="3" marker-end="url(#arb)"/>
  <path d="M362 168 H412" stroke="#2f5fd0" stroke-width="3" marker-end="url(#arb)"/>
  <path d="M412 214 H364" stroke="#2f9e5b" stroke-width="3" marker-end="url(#arg)"/>
  <path d="M206 214 H158" stroke="#2f9e5b" stroke-width="3" marker-end="url(#arg)"/>
</g>
<text x="89" y="186" text-anchor="middle" font-size="14" font-weight="700">Customer</text><text x="89" y="204" text-anchor="middle" font-size="14" font-weight="700">line</text>
<text x="285" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5fd0">Presence</text><text x="285" y="206" text-anchor="middle" font-size="17" font-weight="700" fill="#2f5fd0">Sync</text>
<text x="481" y="186" text-anchor="middle" font-size="14" font-weight="700">Work</text><text x="481" y="204" text-anchor="middle" font-size="14" font-weight="700">phone</text>
<text x="285" y="116" text-anchor="middle" font-size="15" fill="#2f5fd0">"She is busy, hold her calls"</text>
<text x="285" y="278" text-anchor="middle" font-size="15" fill="#2f9e5b">"She is free again"</text>
<text x="30" y="390" font-size="15">•</text><text x="46" y="390" font-size="15">When one side sees Priya get busy or free,</text><text x="46" y="412" font-size="15">Presence Sync tells the other side right away.</text><text x="30" y="434" font-size="15">•</text><text x="46" y="434" font-size="15">Both directions, in real time, for many</text><text x="46" y="456" font-size="15">companies at once.</text></g><g transform="translate(30,620)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">3</text><text x="64" y="46" font-size="22" font-weight="700">The echo</text>
<g filter="url(#rough)">
  <use href="#person" x="20" y="92"/>
  <rect x="100" y="100" width="124" height="58" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <rect x="290" y="100" width="124" height="58" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <use href="#person" x="474" y="92"/>
  <path d="M80 129 H96" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M226 129 H286" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M416 129 H470" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M262 200 h200 a12 12 0 0 1 12 12 v30 a12 12 0 0 1 -12 12 h-200 a12 12 0 0 1 -12 -12 v-30 a12 12 0 0 1 12 -12z M352 200 l0 -24 l20 24" fill="#fff" stroke="#d64545" stroke-width="2.5"/>
  <path d="M320 256 Q292 276 254 290" fill="none" stroke="#d64545" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="64" y="270" width="186" height="64" rx="12" fill="#e6eefc" stroke="#2f5fd0" stroke-width="3.5"/>
  <g transform="rotate(-6 360 312)"><rect x="268" y="272" width="190" height="84" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/></g>
</g>
<text x="50" y="200" text-anchor="middle" font-size="13" font-weight="700">Customer</text>
<text x="162" y="125" text-anchor="middle" font-size="13" font-weight="700">Customer</text><text x="162" y="143" text-anchor="middle" font-size="13" font-weight="700">line</text>
<text x="352" y="125" text-anchor="middle" font-size="13" font-weight="700">rings through</text><text x="352" y="143" text-anchor="middle" font-size="13" font-weight="700">work phone</text>
<text x="504" y="200" text-anchor="middle" font-size="13" font-weight="700">Priya</text>
<text x="362" y="233" text-anchor="middle" font-size="15" fill="#d64545">"Priya is on a call!"</text>
<text x="157" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5fd0">Presence Sync</text>
<g transform="rotate(-6 360 312)">
<text x="363" y="298" text-anchor="middle" font-size="14" font-weight="700">Sticky note:</text><text x="363" y="320" text-anchor="middle" font-size="14">"That call is ours.</text><text x="363" y="340" text-anchor="middle" font-size="14">Ignore it."</text>
</g>
<text x="30" y="412" font-size="15">•</text><text x="46" y="412" font-size="15">The customer line rings through Priya's work</text><text x="46" y="434" font-size="15">phone, so the phone reports our own call back.</text><text x="30" y="456" font-size="15">•</text><text x="46" y="456" font-size="15">A sticky note on Priya says: that echo is ours.</text></g><g transform="translate(630,620)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">4</text><text x="64" y="46" font-size="22" font-weight="700">When the sticky note is late</text>
<g filter="url(#rough)">
  <circle cx="92" cy="160" r="46" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <path d="M92 160 V128 M92 160 L116 172" stroke="#1f2a37" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="172" y="96" width="370" height="60" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/>
  <rect x="172" y="170" width="370" height="60" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/>
  <rect x="172" y="244" width="370" height="60" rx="10" fill="#eaf7ef" stroke="#2f9e5b" stroke-width="3"/>
  <path d="M510 114 l14 14 M524 114 l-14 14" stroke="#d64545" stroke-width="4" stroke-linecap="round"/>
  <path d="M508 200 l8 9 l14 -18" fill="none" stroke="#2f9e5b" stroke-width="4" stroke-linecap="round"/>
</g>
<text x="92" y="234" text-anchor="middle" font-size="13" fill="#566476">a split second</text>
<text x="188" y="122" text-anchor="start" font-size="15" font-weight="700">1. Sticky note on Priya?</text>
<text x="188" y="144" text-anchor="start" font-size="13" fill="#566476">Not there yet: the alert came first</text>
<text x="188" y="196" text-anchor="start" font-size="15" font-weight="700">2. Whose number is on the call?</text>
<text x="188" y="218" text-anchor="start" font-size="13" fill="#566476">One of the customer-line numbers</text>
<text x="188" y="270" text-anchor="start" font-size="15" font-weight="700" fill="#2f9e5b">So it's ours: ignore the echo</text>
<text x="188" y="292" text-anchor="start" font-size="13" fill="#566476">Priya stays correctly booked</text>
<text x="30" y="390" font-size="15">•</text><text x="46" y="390" font-size="15">Sometimes the phone's alert arrives a split</text><text x="46" y="412" font-size="15">second before the sticky note.</text><text x="30" y="434" font-size="15">•</text><text x="46" y="434" font-size="15">Backup check: a customer-line number on the</text><text x="46" y="456" font-size="15">call means it's our own call.</text></g><g transform="translate(30,1130)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">5</text><text x="64" y="46" font-size="22" font-weight="700">Six phone companies, one brain</text><g filter="url(#rough)"><rect x="28" y="78" width="130" height="32" rx="8" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/><rect x="196" y="79" width="80" height="30" rx="6" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/><path d="M160 94H192" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/><path d="M278 94 Q330 151.0 380 200" fill="none" stroke="#2f5fd0" stroke-width="2.5" marker-end="url(#arb)"/><rect x="28" y="120" width="130" height="32" rx="8" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/><rect x="196" y="121" width="80" height="30" rx="6" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/><path d="M160 136H192" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/><path d="M278 136 Q330 172.0 380 203" fill="none" stroke="#2f5fd0" stroke-width="2.5"/><rect x="28" y="162" width="130" height="32" rx="8" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/><rect x="196" y="163" width="80" height="30" rx="6" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/><path d="M160 178H192" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/><path d="M278 178 Q330 193.0 380 206" fill="none" stroke="#2f5fd0" stroke-width="2.5"/><rect x="28" y="204" width="130" height="32" rx="8" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/><rect x="196" y="205" width="80" height="30" rx="6" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/><path d="M160 220H192" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/><path d="M278 220 Q330 214.0 380 209" fill="none" stroke="#2f5fd0" stroke-width="2.5"/><rect x="28" y="246" width="130" height="32" rx="8" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/><rect x="196" y="247" width="80" height="30" rx="6" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/><path d="M160 262H192" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/><path d="M278 262 Q330 235.0 380 212" fill="none" stroke="#2f5fd0" stroke-width="2.5"/><rect x="28" y="288" width="130" height="32" rx="8" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/><rect x="196" y="289" width="80" height="30" rx="6" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/><path d="M160 304H192" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/><path d="M278 304 Q330 256.0 380 215" fill="none" stroke="#2f5fd0" stroke-width="2.5" marker-end="url(#arb)"/><rect x="384" y="160" width="160" height="96" rx="12" fill="#e6eefc" stroke="#2f5fd0" stroke-width="3.5"/></g><text x="93" y="99" text-anchor="middle" font-size="14" font-weight="700">RingCentral</text><text x="236" y="99" text-anchor="middle" font-size="12">translator</text><text x="93" y="141" text-anchor="middle" font-size="14" font-weight="700">Fuze</text><text x="236" y="141" text-anchor="middle" font-size="12">translator</text><text x="93" y="183" text-anchor="middle" font-size="14" font-weight="700">Zoom</text><text x="236" y="183" text-anchor="middle" font-size="12">translator</text><text x="93" y="225" text-anchor="middle" font-size="14" font-weight="700">MS Teams</text><text x="236" y="225" text-anchor="middle" font-size="12">translator</text><text x="93" y="267" text-anchor="middle" font-size="14" font-weight="700">Google Meet</text><text x="236" y="267" text-anchor="middle" font-size="12">translator</text><text x="93" y="309" text-anchor="middle" font-size="14" font-weight="700">Atos</text><text x="236" y="309" text-anchor="middle" font-size="12">translator</text><text x="464" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5fd0">One shared</text><text x="464" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5fd0">brain</text><text x="30" y="390" font-size="15">•</text><text x="46" y="390" font-size="15">Every company reports calls in its own way.</text><text x="30" y="412" font-size="15">•</text><text x="46" y="412" font-size="15">Each gets a small translator into one common</text><text x="46" y="434" font-size="15">language, and one shared brain decides.</text><text x="30" y="456" font-size="15">•</text><text x="46" y="456" font-size="15">A new partner = a new translator.</text></g><g transform="translate(630,1130)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">6</text><text x="64" y="46" font-size="22" font-weight="700">Respect the person</text>
<g filter="url(#rough)">
  <rect x="30" y="86" width="100" height="40" rx="20" fill="#fff4cf" stroke="#b8941a" stroke-width="2.5"/>
  <rect x="200" y="86" width="110" height="40" rx="20" fill="#fde8e8" stroke="#d64545" stroke-width="2.5"/>
  <rect x="380" y="86" width="100" height="40" rx="20" fill="#fff4cf" stroke="#b8941a" stroke-width="2.5"/>
  <path d="M132 106H196" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M312 106H376" stroke="#1f2a37" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M206 232 H496" stroke="#1f2a37" stroke-width="3" stroke-dasharray="8 6"/>
  <use href="#person" x="200" y="202" width="44" height="66"/>
  <use href="#person" x="310" y="202" width="44" height="66"/>
  <use href="#person" x="420" y="202" width="44" height="66"/>
</g>
<text x="80" y="111" text-anchor="middle" font-size="14" font-weight="700">Lunch</text><text x="255" y="111" text-anchor="middle" font-size="14" font-weight="700">On a call</text><text x="430" y="111" text-anchor="middle" font-size="14" font-weight="700">Lunch</text>
<text x="30" y="156" text-anchor="start" font-size="14" fill="#566476">After a call, Priya goes back to what she was doing.</text>
<text x="30" y="176" text-anchor="start" font-size="14" fill="#566476">The system only undoes changes it made itself.</text>
<text x="92" y="234" text-anchor="middle" font-size="14" font-weight="700">Conference</text><text x="92" y="254" text-anchor="middle" font-size="14" font-weight="700">or transfer</text>
<text x="222" y="296" text-anchor="middle" font-size="13" font-weight="700">Priya</text><text x="222" y="314" text-anchor="middle" font-size="13" font-weight="700" fill="#2f9e5b">hangs up: free</text>
<text x="332" y="314" text-anchor="middle" font-size="13" fill="#d64545">still busy</text><text x="442" y="314" text-anchor="middle" font-size="13" fill="#d64545">still busy</text>
<text x="30" y="390" font-size="15">•</text><text x="46" y="390" font-size="15">On calls with several people, each person is</text><text x="46" y="412" font-size="15">tracked separately.</text><text x="30" y="434" font-size="15">•</text><text x="46" y="434" font-size="15">When Priya hangs up, only Priya becomes free.</text><text x="30" y="456" font-size="15">•</text><text x="46" y="456" font-size="15">Manual choices like Lunch always win.</text></g><text x="615.0" y="1648" text-anchor="middle" font-size="14" fill="#566476">Manohar Patil · Presence Sync, NICE inContact (2017-2022) · Founding engineer, then Tech Lead</text></svg>