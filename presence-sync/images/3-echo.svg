<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" width="600" height="510" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Comic Neue',cursive" fill="#1f2a37"><defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
</filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eef5" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a37"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f5fd0"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e5b"/></marker>
<symbol id="person" viewBox="-30 -30 60 90" width="60" height="90" overflow="visible">
  <g fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"><circle cx="0" cy="-12" r="16" fill="#fff"/><path d="M0 4V38M-20 18L0 10L20 18M0 38L-14 58M0 38L14 58"/></g>
</symbol>
<symbol id="phone" viewBox="0 0 64 100" width="64" height="100" overflow="visible">
  <g stroke="#1f2a37" stroke-width="3"><rect x="2" y="2" width="60" height="96" rx="10" fill="#fff"/><rect x="10" y="14" width="44" height="60" rx="3" fill="#e6eefc"/><circle cx="32" cy="86" r="5" fill="#fff"/></g>
</symbol>
</defs><rect width="600" height="510" fill="#ffffff"/><rect width="600" height="510" fill="url(#grid)"/><g transform="translate(15,15)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">3</text><text x="64" y="46" font-size="22" font-weight="700">The echo</text>
<g filter="url(#rough)">
  <use href="#person" x="20" y="92"/>
  <rect x="100" y="100" width="124" height="58" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <rect x="290" y="100" width="124" height="58" rx="10" fill="#fff" stroke="#1f2a37" stroke-width="3"/>
  <use href="#person" x="474" y="92"/>
  <path d="M80 129 H96" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M226 129 H286" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M416 129 H470" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <path d="M262 200 h200 a12 12 0 0 1 12 12 v30 a12 12 0 0 1 -12 12 h-200 a12 12 0 0 1 -12 -12 v-30 a12 12 0 0 1 12 -12z M352 200 l0 -24 l20 24" fill="#fff" stroke="#d64545" stroke-width="2.5"/>
  <path d="M320 256 Q292 276 254 290" fill="none" stroke="#d64545" stroke-width="3" marker-end="url(#arr)"/>
  <rect x="64" y="270" width="186" height="64" rx="12" fill="#e6eefc" stroke="#2f5fd0" stroke-width="3.5"/>
  <g transform="rotate(-6 360 312)"><rect x="268" y="272" width="190" height="84" fill="#ffe27a" stroke="#b8941a" stroke-width="2"/></g>
</g>
<text x="50" y="200" text-anchor="middle" font-size="13" font-weight="700">Customer</text>
<text x="162" y="125" text-anchor="middle" font-size="13" font-weight="700">Customer</text><text x="162" y="143" text-anchor="middle" font-size="13" font-weight="700">line</text>
<text x="352" y="125" text-anchor="middle" font-size="13" font-weight="700">rings through</text><text x="352" y="143" text-anchor="middle" font-size="13" font-weight="700">work phone</text>
<text x="504" y="200" text-anchor="middle" font-size="13" font-weight="700">Priya</text>
<text x="362" y="233" text-anchor="middle" font-size="15" fill="#d64545">"Priya is on a call!"</text>
<text x="157" y="308" text-anchor="middle" font-size="16" font-weight="700" fill="#2f5fd0">Presence Sync</text>
<g transform="rotate(-6 360 312)">
<text x="363" y="298" text-anchor="middle" font-size="14" font-weight="700">Sticky note:</text><text x="363" y="320" text-anchor="middle" font-size="14">"That call is ours.</text><text x="363" y="340" text-anchor="middle" font-size="14">Ignore it."</text>
</g>
<text x="30" y="412" font-size="15">•</text><text x="46" y="412" font-size="15">The customer line rings through Priya's work</text><text x="46" y="434" font-size="15">phone, so the phone reports our own call back.</text><text x="30" y="456" font-size="15">•</text><text x="46" y="456" font-size="15">A sticky note on Priya says: that echo is ours.</text></g></svg>