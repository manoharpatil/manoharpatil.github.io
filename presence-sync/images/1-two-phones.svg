<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" width="600" height="510" font-family="'Segoe Print','Comic Sans MS','Chalkboard SE','Comic Neue',cursive" fill="#1f2a37"><defs>
<filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
</filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8eef5" stroke-width="1"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2a37"/></marker>
<marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f5fd0"/></marker>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d64545"/></marker>
<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f9e5b"/></marker>
<symbol id="person" viewBox="-30 -30 60 90" width="60" height="90" overflow="visible">
  <g fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"><circle cx="0" cy="-12" r="16" fill="#fff"/><path d="M0 4V38M-20 18L0 10L20 18M0 38L-14 58M0 38L14 58"/></g>
</symbol>
<symbol id="phone" viewBox="0 0 64 100" width="64" height="100" overflow="visible">
  <g stroke="#1f2a37" stroke-width="3"><rect x="2" y="2" width="60" height="96" rx="10" fill="#fff"/><rect x="10" y="14" width="44" height="60" rx="3" fill="#e6eefc"/><circle cx="32" cy="86" r="5" fill="#fff"/></g>
</symbol>
</defs><rect width="600" height="510" fill="#ffffff"/><rect width="600" height="510" fill="url(#grid)"/><g transform="translate(15,15)"><rect width="570" height="480" rx="14" fill="#fff" stroke="#1f2a37" stroke-width="3" filter="url(#rough)"/><circle cx="36" cy="38" r="17" fill="#2f5fd0"/><text x="36" y="45" text-anchor="middle" font-size="18" fill="#fff" font-weight="700">1</text><text x="64" y="46" font-size="22" font-weight="700">Two phones that never talk</text>
<g filter="url(#rough)">
  <use href="#person" x="16" y="140"/>
  <path d="M76 190 H112" stroke="#1f2a37" stroke-width="3" marker-end="url(#ar)"/>
  <use href="#phone" x="118" y="126"/>
  <use href="#phone" x="480" y="126"/>
  <use href="#person" x="262" y="140"/>
  <path d="M186 176 Q222 150 258 176" fill="none" stroke="#d64545" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M332 114 h124 a12 12 0 0 1 12 12 v38 a12 12 0 0 1 -12 12 h-84 l-22 22 l3 -22 h-21 a12 12 0 0 1 -12 -12 v-38 a12 12 0 0 1 12 -12z" fill="#fff" stroke="#1f2a37" stroke-width="2.5"/>
  <path d="M220 290 l46 28 M266 290 l-46 28" stroke="#d64545" stroke-width="5" stroke-linecap="round"/>
</g>
<text x="94" y="178" text-anchor="middle" font-size="11" fill="#566476">calls in</text>
<text x="46" y="252" text-anchor="middle" font-size="13" font-weight="700">Customer</text>
<text x="150" y="252" text-anchor="middle" font-size="14" font-weight="700">Customer line</text>
<text x="150" y="270" text-anchor="middle" font-size="13" fill="#566476">contact center</text>
<text x="292" y="252" text-anchor="middle" font-size="14" font-weight="700">Priya</text>
<text x="292" y="270" text-anchor="middle" font-size="13" fill="#566476">the agent</text>
<text x="512" y="252" text-anchor="middle" font-size="14" font-weight="700">Work phone</text>
<text x="512" y="270" text-anchor="middle" font-size="13" fill="#566476">Teams, Zoom...</text>
<text x="222" y="128" text-anchor="middle" font-size="14" fill="#d64545">"New customer!"</text>
<text x="400" y="140" text-anchor="middle" font-size="13">On a Teams call</text>
<text x="400" y="158" text-anchor="middle" font-size="13">with my manager</text>
<text x="282" y="312" text-anchor="start" font-size="20" font-weight="700" fill="#d64545">Double-booked!</text>
<text x="30" y="390" font-size="15">•</text><text x="46" y="390" font-size="15">Priya has a customer line and a work phone.</text><text x="30" y="412" font-size="15">•</text><text x="46" y="412" font-size="15">Neither knows what the other is doing, so a</text><text x="46" y="434" font-size="15">customer reaches her while she's already busy</text><text x="46" y="456" font-size="15">on another call.</text></g></svg>